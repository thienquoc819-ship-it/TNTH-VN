name: Build TNTH VN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SDK licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/home/user/.buildozer/android/platform/android-sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5fd163e790c0b9fe8564d8a767cd67930658\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8791\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TNTH-VN-apk
          path: bin/*.apk
